<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Academics | Sandipan Samanta</title>

        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />

        <link rel="stylesheet" href="css/global.css" />
        <link rel="stylesheet" href="css/academics.css" />
    </head>
    <body>
        <canvas id="network-canvas"></canvas>

        <nav id="main-nav">
            <div class="nav-brand">SS.</div>
            <div class="menu-toggle" id="mobile-menu">
                <i class="fa-solid fa-bars"></i>
            </div>
            <div class="nav-links" id="nav-links"></div>
        </nav>

        <main class="container">
            <h1 class="page-title animate-on-scroll">Academic Profile</h1>

            <!-- Research Projects -->
            <h2 class="section-title animate-on-scroll">
                Research & Internships
            </h2>
            <section
                id="research-grid"
                class="academics-grid animate-on-scroll"
            ></section>

            <!-- Academic Qualifications & Coursework -->
            <h2
                class="section-title animate-on-scroll"
                style="margin-top: 4rem"
            >
                Qualifications & Coursework
            </h2>
            <section
                id="qualifications-container"
                class="animate-on-scroll"
            ></section>

            <!-- Awards & Honors -->
            <h2
                class="section-title animate-on-scroll"
                style="margin-top: 4rem"
            >
                Awards & Honors
            </h2>
            <section
                id="awards-grid"
                class="academics-grid animate-on-scroll"
            ></section>

            <!-- Awards & Achievements -->
            <h2
                class="section-title animate-on-scroll"
                style="margin-top: 4rem"
            >
                Standardized Tests & Entrances
            </h2>
            <section
                id="achievements-grid"
                class="academics-grid animate-on-scroll"
            ></section>
        </main>

        <script src="js/api.js"></script>
        <script src="js/global.js"></script>
        <script src="js/academics.js"></script>
    </body>
</html>
