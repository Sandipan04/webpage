<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Academic profile of Sandipan Samanta — research projects, qualifications, coursework, awards, and achievements." />
        <title>Academics | Sandipan Samanta</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />

        <link rel="stylesheet" href="css/global.css" />
        <link rel="stylesheet" href="css/academics.css" />
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    </head>
    <body>
        <div id="global-loader" class="global-loader">
            <div class="loader-spinner"></div>
            <div class="loader-text">Loading</div>
        </div>
        <div id="network-canvas"></div>

        <nav id="main-nav">
            <div class="nav-brand">SS.</div>
            <div class="menu-toggle" id="mobile-menu">
                <i class="fa-solid fa-bars"></i>
            </div>
            <div class="nav-links" id="nav-links"></div>
        </nav>

        <main class="container">
            <div class="page-header animate-on-scroll">
                <h1 class="page-title">Academic Profile</h1>
                <p class="page-subtitle">Research, qualifications, and academic milestones.</p>
            </div>

            <!-- Research Projects -->
            <h2 class="section-title animate-on-scroll">
                Research & Internships
            </h2>
            <section
                id="research-grid"
                class="academics-grid animate-on-scroll"
            ></section>

            <!-- Academic Qualifications & Coursework -->
            <h2 class="section-title animate-on-scroll" style="margin-top: 4rem">
                Qualifications & Coursework
            </h2>
            <section
                id="qualifications-container"
                class="animate-on-scroll"
            ></section>

            <!-- Awards & Honors -->
            <h2 class="section-title animate-on-scroll" style="margin-top: 4rem">
                Awards & Honors
            </h2>
            <section
                id="awards-grid"
                class="academics-grid animate-on-scroll"
            ></section>

            <!-- Standardized Tests -->
            <h2 class="section-title animate-on-scroll" style="margin-top: 4rem">
                Standardized Tests & Entrances
            </h2>
            <section
                id="achievements-grid"
                class="academics-grid animate-on-scroll"
            ></section>
        </main>

        <footer id="site-footer" class="site-footer"></footer>

        <script src="js/api.js"></script>
        <script src="js/background.js"></script>
        <script src="js/global.js"></script>
        <script src="js/academics.js"></script>
    </body>
</html>
