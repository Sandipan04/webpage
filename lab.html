<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="The Lab — hobby projects, hardware configurations, and experimental builds by Sandipan Samanta." />
        <title>The Lab | Sandipan Samanta</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />

        <link rel="stylesheet" href="css/global.css" />
        <link rel="stylesheet" href="css/lab.css" />
    </head>
    <body>
        <div id="global-loader" class="global-loader">
            <div class="loader-spinner"></div>
            <div class="loader-text">Loading</div>
        </div>
        <div id="network-canvas"></div>

        <nav id="main-nav">
            <div class="nav-brand">SS.</div>
            <div class="menu-toggle" id="mobile-menu">
                <i class="fa-solid fa-bars"></i>
            </div>
            <div class="nav-links" id="nav-links"></div>
        </nav>

        <main class="container">
            <div class="page-header animate-on-scroll">
                <h1 class="page-title">The Lab</h1>
                <p class="page-subtitle">
                    A collection of hobby projects, hardware configurations, and
                    experimental hypotheses (even the ones that proved me wrong).
                </p>
            </div>

            <!-- Filter/Sort -->
            <div class="lab-filters animate-on-scroll" id="lab-filters">
                <span class="filter-btn active" data-filter="all">All</span>
                <span class="filter-btn" data-filter="active">Active</span>
                <span class="filter-btn" data-filter="experimental">Experimental</span>
                <span class="filter-btn" data-filter="completed">Completed</span>
                <span class="filter-btn" data-filter="archived">Archived</span>
            </div>

            <!-- Projects Grid -->
            <section id="lab-grid" class="lab-grid animate-on-scroll"></section>
        </main>

        <footer id="site-footer" class="site-footer"></footer>

        <script src="js/api.js"></script>
        <script src="js/background.js"></script>
        <script src="js/global.js"></script>
        <script src="js/lab.js"></script>
    </body>
</html>
