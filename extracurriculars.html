<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Extracurricular activities, clubs, volunteering, and community contributions by Sandipan Samanta." />
        <title>Extracurriculars | Sandipan Samanta</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />

        <link rel="stylesheet" href="css/global.css" />
        <link rel="stylesheet" href="css/extracurriculars.css" />

        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script
            id="MathJax-script"
            async
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
        ></script>

    <body>
        <div id="global-loader" class="global-loader">
            <div class="loader-spinner"></div>
            <div class="loader-text">Loading</div>

        <div id="network-canvas"></div>

        <nav id="main-nav">
            <div class="nav-brand">SS.</div>
            <div class="menu-toggle" id="mobile-menu">

        <main class="container">
            <div class="page-header animate-on-scroll">

            </h2>
            <div id="clubs-container"></div>

            <h2 class="section-title animate-on-scroll" style="margin-top: 4rem">
                Volunteering & Community
            </h2>
            <section
                id="volunteering-grid"
                class="activity-grid animate-on-scroll"
            ></section>
        </main>

        <footer id="site-footer" class="site-footer"></footer>

        <script src="js/api.js"></script>
        <script src="js/background.js"></script>
        <script src="js/global.js"></script>
        <script src="js/extracurriculars.js"></script>
