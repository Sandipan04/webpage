name: Deploy Combined Portfolio

on:
  push:
    branches: ["v2"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the new website code
      - name: Checkout New Website (v2 branch)
        uses: actions/checkout@v4
        with:
          ref: v2

      # 2. Checkout the old website code into a folder named "old"
      - name: Checkout Old Website (main branch)
        uses: actions/checkout@v4
        with:
          ref: main
          path: old

      # 3. Configure, Upload, and Deploy to GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
