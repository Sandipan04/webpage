<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Gallery — deep sky captures, event archives, and visual logs by Sandipan Samanta." />
        <title>Gallery | Sandipan Samanta</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />

        <link rel="stylesheet" href="css/global.css" />
        <link rel="stylesheet" href="css/gallery.css" />
    </head>
    <body>
        <div id="global-loader" class="global-loader">
            <div class="loader-spinner"></div>
            <div class="loader-text">Loading</div>
        </div>
        <div id="network-canvas"></div>

        <nav id="main-nav">
            <div class="nav-brand">SS.</div>
            <div class="menu-toggle" id="mobile-menu">
                <i class="fa-solid fa-bars"></i>
            </div>
            <div class="nav-links" id="nav-links"></div>
        </nav>

        <main class="container">
            <div class="page-header animate-on-scroll">
                <h1 class="page-title">Gallery</h1>
                <p class="page-subtitle">
                    Visual logs, deep sky captures, and event archives.
                </p>
            </div>

            <!-- Gallery Grid -->
            <section
                id="gallery-grid"
                class="gallery-grid animate-on-scroll"
            ></section>
        </main>

        <!-- Lightbox Modal -->
        <div id="lightbox" class="lightbox-overlay" style="display: none">
            <button class="lightbox-close" id="lightbox-close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
            <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous"><i class="fa-solid fa-chevron-left"></i></button>
            <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next"><i class="fa-solid fa-chevron-right"></i></button>
            <div class="lightbox-content">
                <img id="lightbox-img" src="" alt="" />
                <div class="lightbox-caption" id="lightbox-caption"></div>
                <div class="lightbox-counter" id="lightbox-counter"></div>
            </div>
        </div>

        <footer id="site-footer" class="site-footer"></footer>

        <script src="js/api.js"></script>
        <script src="js/background.js"></script>
        <script src="js/global.js"></script>
        <script src="js/gallery.js"></script>
    </body>
</html>
